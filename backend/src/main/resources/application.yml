spring:
  application:
    name: invoiceflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoiceflow}
    username: ${DB_USERNAME:invoiceflow}
    password: ${DB_PASSWORD:invoiceflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:5}MB
      max-request-size: 10MB

  cache:
    type: simple

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html

# InvoiceFlow custom config
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_256_BIT_KEY}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://192.168.0.249:8081,exp://192.168.0.249:8081}
  url:
    frontend: ${APP_URL:http://localhost:3000}
    api: ${API_URL:http://localhost:8080}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size-mb: ${MAX_FILE_SIZE_MB:5}
  mail:
    from: ${MAIL_FROM:noreply@invoiceflow.co.za}
    from-name: InvoiceFlow
  payfast:
    merchant-id: ${PAYFAST_MERCHANT_ID:}
    merchant-key: ${PAYFAST_MERCHANT_KEY:}
    passphrase: ${PAYFAST_PASSPHRASE:}
    sandbox: ${PAYFAST_SANDBOX:true}
    notify-url: ${API_URL:http://localhost:8080}/api/v1/payments/notify
    return-url: ${APP_URL:http://localhost:3000}/payment/success
    cancel-url: ${APP_URL:http://localhost:3000}/payment/cancel
  security:
    rate-limit:
      login-attempts: 5
      login-window-minutes: 15
  invoice:
    watermark:
      draft-text: "DRAFT"
      overdue-text: "OVERDUE"
      paid-text: "PAID"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.invoiceflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
